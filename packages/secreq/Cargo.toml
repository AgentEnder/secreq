[package]
name = "secreq"
version = "0.2.0"
edition = "2021"
description = "Per-binary CLI wrapper that injects credentials from your secret store of choice — 1Password Shell Plugins, but generic and multi-provider"
license = "MIT"
readme = "README.md"
homepage = "https://craigory.dev/secreq"
repository = "https://github.com/AgentEnder/secreq"
documentation = "https://craigory.dev/secreq"
# crates.io caps this at 5; each must be <= 20 chars and start alphanumeric.
keywords = ["secrets", "credentials", "1password", "ssh-agent", "cli"]
# Both are canonical crates.io category slugs (see `cargo publish` validation).
categories = ["command-line-utilities", "authentication"]
# Keep the published tarball lean and buildable from a bare checkout. Now that
# the crate is a workspace member at `packages/secreq`, the old repo-root
# exclusions (`/sdk`, `/.github`, `/dev-docs`, `/docs`, `/dist`, `/TODO.md`,
# `/out.log`) all sit OUTSIDE the package boundary and are already omitted from
# the tarball. The only bulky path still inside the crate is the wasm test
# fixtures, which nothing in `cargo install secreq` needs.
exclude = ["/tests/fixtures", "/project.json"]

[[bin]]
name = "secreq"
path = "src/main.rs"

[lib]
name = "secreq"
path = "src/lib.rs"

[[example]]
name = "gen-schema"
path = "examples/gen_schema.rs"

[[example]]
name = "gen-auto-rules-schema"
path = "examples/gen_auto_rules_schema.rs"

[[example]]
name = "gen-cli-reference"
path = "examples/gen_cli_reference.rs"


[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
# `json5` is retained only for the m0003 config-format migration, which reads
# the pre-TOML files once. Nothing else may deserialize through it.
json5 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Format-preserving edits, so `wrap add` / `ssh add` / an editor pick no longer
# rebuild the file and drop the user's comments.
toml_edit = "0.22"
zeroize = { version = "1", features = ["derive"] }
portable-pty = "0.8"
sysinfo = "0.33"
cliclack = "0.3"
crossterm = "0.28"
dirs = "5"
signal-hook = "0.3"
libc = "0.2"
eframe = { version = "0.34", default-features = false, features = [
  "default_fonts",
  "wgpu",
  "wayland",
  "x11",
] }
egui = "0.34"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
blake3 = "1"
rand = "0.8"
glob = "0.3"
# `p256` (not just `ecdsa`) is required for ecdsa-nistp256 signing/keygen:
# the `ecdsa` feature only pulls the `sec1` encoding, while the actual
# curve Signer impl is gated behind `p256`.
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "p256"] }
# ECDSA P-256 verification for `secreq link` decision signatures. The
# plain-HTTP client signs with the matching software P-256 implementation in
# `@noble/curves`; Web Crypto is unavailable on that LAN origin.
#
# Already in the tree via `ssh-key`'s `p256` feature, so the direct dependency
# costs nothing extra to build.
p256 = { version = "0.13", features = ["ecdsa"] }
# Constant-time comparison for `secreq link` enrollment tokens. Token guesses
# arrive over the LAN, so equality must not expose how much of a candidate
# matched. Already in the tree through the P-256 crypto stack, so taking it
# directly costs nothing extra to build.
subtle = "2.6"
ssh-encoding = "0.2"
# Needed only to honor the SSH_AGENT_RSA_SHA2_256/512 SIGN_REQUEST flags:
# ssh-key 0.6's public Signer impl for RSA hardcodes SHA-512, so we drop to
# the same rsa::pkcs1v15 path it uses internally to select the hash. Pinned
# to the version ssh-key resolves; re-exports `sha2` and `signature`.
rsa = { version = "0.9", features = ["sha2"] }
# Unified textual diff for `secreq migrate restore`, which must show what a
# restore discards. Textual, not semantic: the binary doing the restore
# generally cannot parse both the current and the snapshot format (that is
# the premise of a downgrade), so a parsed diff is impossible in the case
# that actually needs the warning.
similar = "2"

# `.env` parsing for `secreq run --env-file` (quoting, escapes, `export`,
# `${VAR}` substitution). We use its non-mutating `from_path_iter`, never
# the env-loading entry points.
dotenvy = "0.15"

# SHA-256 of registered wasm rule modules (`rules::sha256_hex`), verified
# on every rules load so a module that drifted from what the user
# registered is refused. Already in the tree transitively via `rsa` /
# `ssh-key`, so the direct dependency costs nothing extra to build.
sha2 = "0.10"

# Sandboxed execution of user-compiled wasm rule modules (`wasm_rules`).
# Minimal feature set on purpose: `cranelift` + `runtime` compile and run
# core wasm; no `wat`, no WASI, no component model — a rule module's only
# window on the world is the ctx we hand it. `anyhow` enables the
# `From<wasmtime::Error> for anyhow::Error` impl our error plumbing uses.
wasmtime = { version = "46.0.1", default-features = false, features = [
  "cranelift",
  "runtime",
  "anyhow",
] }
textwrap = "0.16"
console = "0.15"

# A synchronous, thread-per-connection HTTP/1.1 server for the `secreq link`
# LAN listener. Sync and thread-based is the point: the daemon is already
# thread-per-connection (`daemon/server.rs`), so this needs no async runtime and
# no colouring of the surrounding code.
#
# Hand-rolling was considered and rejected. Request smuggling, header injection
# and chunked-encoding edge cases are exactly the class of bug a security tool
# should not be writing from scratch for four endpoints.
tiny_http = "0.12"

# Renders the `secreq link` pairing QR as Unicode half-blocks in the terminal.
# No image output, no external `qrencode` binary — the QR has to appear in the
# recorded CLI transcript, which is text.
qrcode = { version = "0.14", default-features = false }

# Derives `docs/wraps.schema.json` and `docs/auto-rules.schema.json` from the
# types that read those files, so a field cannot reach disk without reaching
# the published schema. See `src/schema.rs`.
#
# **Optional, and off in every build a user runs.** `cargo build` and `cargo
# install secreq` resolve without it; the `schema` feature is switched on only
# for the test/example build, by the self dev-dependency below — the same trick
# `harness` uses, and for the same reason: `tests/schema_drift.rs` is a separate
# crate that links this lib as an ordinary dependency.
schemars = { version = "1", optional = true }

# The Unicode general category of a char, from tables generated out of the UCD
# (`UNICODE_VERSION` 16.0.0). `provenance::is_invisible_or_reordering` is the
# only caller, and it is the reason for the dependency: that predicate spent two
# audits as a hand-written range list and came up short in both — first the bidi
# and zero-width characters, then U+061C, the soft hyphen and the tag block.
# Each gap was one person recalling which code points are "format characters",
# which is a question the UCD answers exactly and memory does not.
#
# Chosen for what it costs: `no_std`, zero dependencies, no `unsafe`, and a
# `build.rs` that only compresses the crate's own committed table (no network,
# no codegen from the environment). It buys categories Cc and Cf outright; the
# residue this crate still names by hand is documented at the predicate.
unicode-general-category = "1.1"

# macOS-only.
#
# `winit` re-exported for platform extension traits in `daemon/mod.rs`.
#
# `objc2-foundation` is for `NSProcessInfo.beginActivity(...)` which
# opts the consent-window child out of App Nap. Without it, macOS
# throttles our run loop when the window is in the background and
# updates from the daemon arrive minutes late. Used in
# `daemon/child.rs::macos_disable_app_nap`.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
objc2-foundation = "0.3"

[features]
# Test-only entry points that must not exist in a shipped binary. Enabled
# automatically for `cargo test` by the self dev-dependency below, so nobody
# has to remember a flag — and a plain `cargo build` never sees them.
harness = []

# `src/schema.rs` and the `schemars` derives it reads. Carried by the same self
# dev-dependency as `harness`, so `cargo test` and `cargo run --example
# gen-schema` have it and a plain `cargo build` does not.
schema = ["dep:schemars"]

[dev-dependencies]
# Integration tests validate a TOML fixture against the published JSON Schema.
toml = "0.8"
# Depending on ourselves is how a feature is turned on for the test build only.
# Integration tests under `tests/` are separate crates that link this lib as an
# ordinary dependency, so `#[cfg(test)]` would hide `harness` from exactly the
# code that needs it.
secreq = { path = ".", features = ["harness", "schema"] }
tempfile = "3"
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Assembles the hand-written .wat fixtures in tests/fixtures/wasm_rules/
# at test time. Dev-only: the production loader accepts binaries only.
wat = "1.253.0"
vt100 = "0.16.2"
# A JSON Schema validator, so `tests/schema_drift.rs` can check the published
# contract against values `secreq` actually writes rather than against the
# generator that produced it. Draft-07, which is what both schemas declare.
boon = "0.6"
oxipng = { version = "10.1.1", default-features = false, features = ["parallel"] }

# Lints enabled because the codebase is already clean of them, so each one is
# a ratchet rather than a backlog: it cannot regress without failing CI, and
# it cost nothing to turn on.
#
# Deliberately NOT enabled, with reasons, so nobody re-litigates them blind:
#   print_stdout      — this crate is a CLI; printing is its job.
#   expect_used       — the house style is `expect` with a sentence explaining
#                       the invariant, which reads better than a silent `?`.
#                       Not a volume artifact: it is a decision about how a
#                       panic should read, and it stands.
#   pedantic          — 615 warnings, overwhelmingly cast and doc nits.
#
# `indexing_slicing` took the longest to land and is worth the note. It sat out
# for a year as "all-or-nothing at 213 hits", which was an artifact: 141 of
# those were inline `mod tests`, where a panic is the assertion, and clippy has
# had `allow-indexing-slicing-in-tests` since 1.79. One line in the workspace
# `clippy.toml` took 213 to 41; the rest were rewritten (17 mechanically, 18 by
# moving the safety from an argument to a structure, one `#[allow]` naming its
# invariant). No site turned out to be actually fallible, but the sweep did
# surface a real bug: `is_secreq_shim` used a bare `read` and could return a
# false negative on a short read, which its doc comment already denied.
#
# The point of having it here rather than per-module is that the *next*
# untrusted-input parser is covered without anyone remembering to ask.
# `daemon/ssh_proto.rs` needed a hand-placed `#![deny]` precisely because
# nothing else would have caught it.
#
# `unwrap_used` was declined on the same premise and turned out to be the same
# artifact. The old note here read "near-clean in `src` but pervasive in the
# inline test modules, where a panic *is* the assertion" — which is true, and is
# a description of what `allow-unwrap-in-tests` is for. Measured: 942 sites
# crate-wide, 781 of them inside an inline `mod tests`. One line in
# `clippy.toml` takes that to 29, and the library is at **zero** — nothing in
# `src` was ever unwrapping, so this lint is a ratchet on day one rather than a
# backlog.
#
# The 29 are helper functions in `tests/*.rs` — separate crates, with no
# `#[cfg(test)]` module and no enclosing `#[test]` fn for the key to recognise,
# so it cannot reach them. Four file-level `#![allow]`s say that where a reader
# of those files will see it, rather than 29 hand-placed ones.
[lints.clippy]
# A panic reachable from an index is a denial of service when the indexed
# bytes came off a socket. Tests are exempt via `clippy.toml`.
indexing_slicing = "deny"
# An `unwrap` in `src` is an invariant nobody wrote down. Say it with `expect`
# and a sentence, or handle the `None`. Tests are exempt via `clippy.toml`.
unwrap_used = "deny"
# CLAUDE.md forbids TODOs in shipped code. This is that rule, enforced.
todo = "deny"
unimplemented = "deny"
# Debugging residue: `dbg!` in a consent daemon prints to stderr in front of
# a user deciding whether to release a secret.
dbg_macro = "deny"
# Leaks a value's destructor. In a crate holding secret material, the drop is
# the point.
mem_forget = "deny"

# ── Mechanical pedantic lints ──
# Enabled as a set because each is a local rewrite with no judgement call in
# it, and `cargo clippy --fix` applies most of them. The rest of `pedantic`
# stays off: `missing_errors_doc` (268) and `must_use_candidate` (234) are
# library-API policy this application does not need, and the `cast_*` family
# needs a decision per site about whether the truncation is safe — which is
# exactly the kind of thing a blanket lint turns into a rubber stamp.
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
borrow_as_ptr = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
items_after_statements = "warn"
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"
ignored_unit_patterns = "warn"
single_match_else = "warn"
