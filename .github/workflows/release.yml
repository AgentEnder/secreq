name: Release

# Everything downstream of a version tag. Normally reached by merging the
# release PR that `release-plz.yml` maintains, which tags and then calls this;
# a hand-pushed `vX.Y.Z` and a `workflow_dispatch` re-run against an existing
# tag both land here too. This workflow cross-compiles secreq for the four
# first-class targets on native runners, verifies each artifact self-reports
# the tagged commit's SECREQ_BUILD_ID, checksums every tarball, keyless-signs
# the checksum manifest with cosign, and publishes the Release with the notes
# from CHANGELOG.md.
on:
  push:
    tags:
      - 'v*'
  # Manual re-run against an already-pushed tag (e.g. to re-upload assets).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. v0.1.0'
        required: true
  # Called by release-plz.yml the moment it lands a version bump on main.
  #
  # The tag trigger above cannot serve that path: a tag pushed with
  # `GITHUB_TOKEN` does not start a workflow, which is GitHub's guard against
  # a job triggering itself forever. The usual answer is a PAT or a GitHub App
  # so the push looks like a person; calling the workflow outright skips the
  # question and leaves one fewer credential in the repository.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the Release and upload assets
  id-token: write # cosign keyless (Sigstore OIDC) signing — no stored secret

env:
  CARGO_TERM_COLOR: always

jobs:
  # One native runner per target: cross-compiling the eframe/wgpu wayland+x11
  # stack is painful, and building natively also lets each job *run* its own
  # binary to verify the stamped build id.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      # Full history so build.rs sees the tagged commit's real short sha
      # (and a clean tree, so the id carries no `-dirty` marker).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Same wayland/xkbcommon/xcb stack the CI build links (no-op on macOS).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin secreq

      # The build id is only meaningful if it names the tagged commit and the
      # tree was clean. Both binaries here are native, so we can just run them.
      - name: Verify stamped build id
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/secreq"
          GIT_SHA="$(git rev-parse --short=12 HEAD)"
          VER_OUT="$("$BIN" --version)"
          echo "secreq --version → $VER_OUT"
          if ! grep -q "$GIT_SHA" <<<"$VER_OUT"; then
            echo "::error::--version ($VER_OUT) is missing the tagged commit sha ($GIT_SHA)"
            exit 1
          fi
          if grep -q -- "-dirty" <<<"$VER_OUT"; then
            echo "::error::released build was cut from a dirty tree: $VER_OUT"
            exit 1
          fi

      - name: Package tarball and checksum
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="secreq-${VERSION}-${TARGET}"
          mkdir "$STAGE"
          cp "target/${TARGET}/release/secreq" "$STAGE/"
          cp README.md LICENSE CHANGELOG.md "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          if command -v sha256sum >/dev/null; then
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.stage }}
          path: |
            ${{ steps.pkg.outputs.stage }}.tar.gz
            ${{ steps.pkg.outputs.stage }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # A mistagged release (tag vs Cargo.toml version drift) is a silent
      # footgun for install channels; fail loudly instead.
      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/secreq/Cargo.toml | head -1)"
          TAG_VERSION="${{ steps.ver.outputs.version }}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f ./*.sha256 # fold the per-target files into one manifest
          sha256sum ./*.tar.gz > SHA256SUMS
          echo "== SHA256SUMS =="
          cat SHA256SUMS

      # Fill the Homebrew formula's per-arch sha256 values from the manifest we
      # just built, then ship it as a release asset the tap
      # (AgentEnder/homebrew-secreq) pulls. Keeps the formula's checksums
      # honest without a second build.
      - name: Generate Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          bash dist/homebrew/gen-formula.sh \
            --version "$VERSION" --checksums dist/SHA256SUMS > dist/secreq.rb
          echo "== secreq.rb ==" && cat dist/secreq.rb

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG entry for $VERSION; falling back to auto-generated notes." >&2
            echo "no_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless (Sigstore) signature over the checksum manifest — the identity
      # is this workflow's OIDC token, so there is no private key to store.
      # Verify with:
      #   cosign verify-blob --certificate SHA256SUMS.pem \
      #     --signature SHA256SUMS.sig \
      #     --certificate-identity-regexp '.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     SHA256SUMS
      - name: Sign checksum manifest (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES_ARGS=(--notes-file notes.md)
          if [ "${{ steps.notes.outputs.no_notes }}" = "true" ]; then
            NOTES_ARGS=(--generate-notes)
          fi

          # Named, not globbed. `dist/` is both where `download-artifact`
          # unpacks the builds and where the checkout already put the tracked
          # `dist/homebrew/` directory and `dist/install.sh`, so `dist/*` hands
          # `gh` a directory and it exits non-zero — on the very first release,
          # after every build has already succeeded. Listing the assets also
          # makes the release's contents a thing this file states rather than a
          # thing that depends on what happens to be lying in a folder.
          ASSETS=(
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
            dist/secreq.rb
          )
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::release asset missing: $asset"
              exit 1
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "secreq $TAG" "${NOTES_ARGS[@]}"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "secreq $TAG" \
              "${NOTES_ARGS[@]}" \
              "${ASSETS[@]}"
          fi

      # Push the formula this job just generated straight into the tap.
      #
      # `TAP_GITHUB_TOKEN` holds an **SSH deploy key** for
      # `AgentEnder/homebrew-secreq`, not a token, which decides the mechanism:
      # a deploy key authenticates git transport and nothing else, so there is
      # no `repository_dispatch` available — that is a REST call and needs a
      # bearer token. So this writes to the tap directly rather than asking the
      # tap to come and fetch.
      #
      # The trade is worth naming. A deploy key is scoped to one repository by
      # construction rather than by a setting someone has to get right, and it
      # does not expire, so the tap cannot silently stop updating the way an
      # expired PAT would. In exchange the formula arrives as a push from here
      # instead of a job whose logs live in the tap.
      - name: Update the Homebrew tap
        if: ${{ !contains(steps.ver.outputs.version, '-') }}
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # `printf` rather than `echo "$KEY"`: a secret pasted without a
          # trailing newline makes OpenSSH reject the file as malformed, and
          # the error it gives says nothing about newlines.
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null

          # `IdentitiesOnly` so the runner's own agent, if it has one, cannot
          # offer a different key and get us rejected before this one is tried.
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:AgentEnder/homebrew-secreq.git tap
          cp dist/secreq.rb tap/Formula/secreq.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/secreq.rb
          if git diff --staged --quiet; then
            echo "formula unchanged; nothing to push"
            exit 0
          fi
          git commit -m "secreq ${VERSION}"
          git push

      # The key is on an ephemeral runner, but a release job that fails
      # partway should not leave it sitting in the workspace for whatever
      # runs next in the same job.
      - name: Remove the tap deploy key
        if: always()
        run: rm -f ~/.ssh/tap_key

  # Publishing the crate is the one irreversible step in the pipeline: a
  # version on crates.io can be yanked but never replaced. So it is its own
  # job, gated on a `crates-io` environment with a required reviewer, and it
  # runs only after `publish` has put the signed binaries out.
  #
  # No stored registry token. `crates-io-auth-action` exchanges this job's
  # OIDC identity for a short-lived crates.io token and revokes it in its post
  # step, which is why `packages/secreq/release.toml` sets `publish = false`:
  # the crate ships from the commit CI verified, not from a working copy.
  publish-crate:
    name: publish crate
    needs: publish
    runs-on: ubuntu-latest
    environment: crates-io
    # A pre-release tag (v0.1.0-rc.1) exercises the binary pipeline without
    # spending a crates.io version, which is what makes a rehearsal cheap.
    # Read off the ref rather than a `needs` output: a job-level `if` cannot
    # see a step output from its own job, and an output the upstream job never
    # declared evaluates to the empty string — which passes this test and
    # publishes the rehearsal for real.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    permissions:
      id-token: write # mint the crates.io token
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish --locked -p secreq
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
