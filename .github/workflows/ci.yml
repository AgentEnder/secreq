name: CI

# Quality gates for a distributable build: formatting, lints (warnings are
# errors), the test suite, and the schema-drift guard (tests/schema_drift.rs,
# run as part of `cargo test`). macOS and Linux are the two first-class
# targets, so the build/lint/test job runs on both.
on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - &miseCache
        name: Cache mise tools and rust toolchain
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.local/share/mise/installs
            ~/.cargo/bin
            ~/.rustup
          key: mise-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'rust-toolchain.toml') }}
      - &miseInstall
        name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: false
      - run: cargo fmt --all -- --check

  # The JS/TS/CSS half of the same gate. Without it these files drift: before
  # this job existed nothing checked them, and 60 of the 61 files under
  # docs-site had wandered into their own shape.
  web:
    name: oxfmt + oxlint + doc fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - *miseCache
      - *miseInstall
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint

      # The TypeScript fragments in docs/wasm-rules.md and the SDK's README are
      # compiled against the real secreq-rule typings. A field renamed on
      # RuleCtx, a changed `decide` signature, a constructor that no longer
      # exists — each fails here by markdown line number, rather than shipping a
      # guide that teaches a package nobody publishes.
      - run: pnpm --filter @secreq/docs-site run typecheck-docs

      # Prose linting. Errors fail the build; warnings and suggestions do not,
      # so a rule can be tightened without turning every open PR red. See
      # .vale.ini for scope and .vale/styles/Secreq/ for the rules.
      - name: Vale (published prose)
        run: mise run docs

  test:
    name: build / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # eframe/wgpu/winit pull in the wayland + xkbcommon stack; the wayland
      # crates link the system library at build time. x11 and xkbcommon are
      # dlopen'd at runtime, but the packages are installed anyway so the UI
      # screenshot tests link — their CPU layout half runs in this job, and the
      # wgpu half must at least compile. No-op on macOS, which uses native
      # frameworks.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - *miseCache
      - *miseInstall

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      # `cargo test` runs the unit, integration, and doc tests, including the
      # schema-drift guard in tests/schema_drift.rs.
      #
      # It also runs tests/ui_screenshots.rs, which needs no GPU here: without
      # $SECREQ_BLESS_SHOTS each fixture only lays its window out on the CPU
      # and compares the result against the layout.json committed beside its
      # renders, so a UI change that never got a regen fails this job. Only
      # re-rendering the PNGs needs wgpu, and that is what the env var gates.
      #
      # Pixels are deliberately never compared: a wgpu render is not
      # byte-reproducible across GPUs, so doing so would force a choice between
      # fixtures that are reviewable in a PR and fixtures that are verified in
      # CI. See tests/screenshot_freshness.rs for the rest of the bookkeeping
      # this job enforces (completeness, orphans, snapshots, README rows).
      - name: Test
        run: cargo test
