name: CI

# Quality gates for a distributable build: formatting, lints (warnings are
# errors), the test suite, prose, and the schema-drift guard
# (tests/schema_drift.rs, run as part of `cargo test`). macOS and Linux are the
# two first-class targets, so the job runs on both.
#
# It is ONE job running `nx affected`, not a job per tool. What runs is decided
# by the graph, so a docs-only PR stops paying for clippy and the Rust test
# suite and a Rust-only PR stops rebuilding the docs site. That is the whole of
# the saving: this workspace has no Nx Cloud, so there is no remote cache and
# nothing is reused between runs. Enabling one would make the cache do the rest.
on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # One job, not one per tool. The old split (rustfmt / web / test) meant three
  # runners each paying its own checkout, toolchain install and dependency
  # restore to run a few seconds of work — and the split had to be maintained
  # by hand as targets were added. `nx affected` already decides what runs, so
  # the job only has to provide a machine that can run all of it.
  #
  # The matrix stays: macOS and Linux are both first-class targets for the
  # crate. The JS and prose checks are repeated on macOS as a result, which
  # costs a couple of seconds and buys not having to special-case them.
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # `nx affected` diffs against the merge base, so it needs the history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # eframe/wgpu/winit pull in the wayland + xkbcommon stack; the wayland
      # crates link the system library at build time. x11 and xkbcommon are
      # dlopen'd at runtime, but the packages are installed anyway so the UI
      # screenshot tests link — their CPU layout half runs here, and the wgpu
      # half must at least compile. No-op on macOS, which uses native
      # frameworks.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Cache mise tools and rust toolchain
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.local/share/mise/installs
            ~/.cargo/bin
            ~/.rustup
          key: mise-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'rust-toolchain.toml') }}
      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: false

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      # Vite's fixed-name output is byte-deterministic for identical sources
      # (verified before adopting this check). It writes directly inside the
      # crate because Cargo cannot package the sibling link-ui workspace.
      # `git diff` catches stale tracked bytes; the status check also catches a
      # new untracked chunk/font/map that the three-route server cannot serve.
      - name: Check committed link client bundle is fresh
        run: |
          pnpm --filter @secreq/link-ui run build
          git diff --exit-code packages/secreq/dist/link-ui
          test -z "$(git status --porcelain --untracked-files=all packages/secreq/dist/link-ui)"

      # Derives NX_BASE / NX_HEAD, which `nx affected` reads with no flags.
      - uses: nrwl/nx-set-shas@v4

      # Everything, selected by the graph:
      #
      #   lint          clippy on the crates, oxlint on the JS
      #   format:check  cargo fmt and oxfmt
      #   test          cargo test for the unit, integration and doc tests,
      #                 plus Vitest + jsdom for the docs-site UI components.
      #                 The Rust suite includes the schema-drift guard in
      #                 tests/schema_drift.rs and the CPU layout half of
      #                 tests/ui_screenshots.rs, which needs no GPU: without
      #                 $SECREQ_BLESS_SHOTS each fixture only lays its window
      #                 out and compares against the layout.json committed
      #                 beside its renders, so a UI change that never got a
      #                 regen fails here. Only re-rendering needs wgpu.
      #                 Pixels are deliberately never compared — a wgpu render
      #                 is not byte-reproducible across GPUs. See
      #                 tests/screenshot_freshness.rs for the rest.
      #   typecheck     the link client's TypeScript; Vite and Vitest transpile
      #                 it without checking types, so this is its compile gate.
      #                 The root tsconfig satisfies @nx/js:typescript-sync;
      #                 its references are generator-owned, not hand-maintained
      #   typecheck-docs  the TypeScript fragments in docs/wasm-rules.md and
      #                 the SDK README, compiled against the real typings
      #   vale          published prose; errors fail, warnings do not
      #   audit         redundancy / stale-claim / unused-fixture sweep
      #
      # Affected-gating the Rust half is only sound because a docs-only change
      # reaches `secreq`. `docs/` and `dev-docs/` are fixtures for the drift and
      # freshness tests, so touching them really can turn this red. Two things
      # carry that, and both are deliberate: `secreq` has implicit dependencies
      # on the `docs` and `dev-docs` projects, AND `secreq:test` declares those
      # trees as `{workspaceRoot}` inputs — which `nx affected` honours on its
      # own (a file owned by no project still marks every project declaring it
      # as an input). Removing both would silently un-gate this job.
      - run: npx nx affected -t lint,format:check,test,typecheck,typecheck-docs,vale,audit
