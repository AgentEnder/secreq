name: Deploy Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &miseCache
        name: Cache mise tools and rust toolchain
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.local/share/mise/installs
            ~/.cargo/bin
            ~/.rustup
          key: mise-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'rust-toolchain.toml') }}
      - &miseInstall
        name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for OIDC support
        # Two-step upgrade: npm 10.9.7 (bundled with Node 22.22.2) crashes
        # self-upgrading directly to npm@latest due to npm/cli#9151.
        # First upgrade to 11.11.0 (which still bundles promise-retry),
        # then to latest.
        run: npm install -g npm@11.11.0 && npm install -g npm@latest

      - name: Setup Git User
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      # The docs build generates its webfonts from the fonts egui embeds
      # (packages/webfonts), so this job needs a Rust toolchain. It is a tiny
      # standalone crate — no egui, no wgpu — so the compile is seconds, and
      # the cache makes repeat runs free.
      - name: Install stable toolchain (webfonts)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: webfonts
      - run: pnpm install --frozen-lockfile
      # The site is served from a path, not a domain root:
      # https://craigory.dev/secreq/. GitHub serves a project's Pages under
      # the owner's site at /<repo>/, so every absolute asset and link has to
      # carry that prefix or it resolves against craigory.dev itself. Vite
      # reads this into `base`, and `applyBaseUrl` puts it on the handful of
      # URLs built outside the bundler (screenshots, schemas, search).
      #
      # Same mechanism preview-docs.yml uses for /pr/<n>/, so both deploys
      # exercise the prefixed build rather than only the previews doing it.
      - run: npx nx deploy docs-site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_URL: /secreq/
