# release-plz owns *deciding* a release; `.github/workflows/release.yml` owns
# *performing* one.
#
# The split matters. release-plz reads the conventional commits since the last
# tag, works out the SemVer bump, writes the CHANGELOG section, and opens a PR.
# Merging that PR is the release decision, and the tag it then creates is the
# only thing release.yml needs. Everything after the tag — cross-compiling four
# targets, cosign, the GitHub Release, the Homebrew formula, crates.io — already
# exists there and is not duplicated here.
#
# So the three switches below are all "don't do the second half":

[workspace]
# crates.io is published by release.yml's `publish-crate` job, which mints a
# short-lived token from GitHub's OIDC identity. Publishing from here would
# need a stored registry token — the thing that job exists to avoid.
publish = false

# The GitHub Release is created by release.yml, which has the binaries, the
# checksums and the signature to attach to it. A release created here would be
# an empty one that the real job then has to find and edit.
git_release_enable = false

# The tag is the handoff, so release-plz does create it. release.yml is invoked
# directly rather than by the tag push, because a tag pushed with GITHUB_TOKEN
# does not start a workflow.
git_tag_enable = true

# Pinned, though it is already the default. release-plz names tags
# `v{{ version }}` for a workspace with one public package and
# `{{ package }}-v{{ version }}` for one with several — and `webfonts` is only
# out of the running because it carries `publish = false`. Making that crate
# publishable would silently rename every future tag to `secreq-v…`, which
# `release.yml`'s `v*` trigger and the `install.sh` version lookup would both
# quietly stop matching. Stating the format keeps that a deliberate change.
git_tag_name = "v{{ version }}"

# Keep a Changelog, which is what CHANGELOG.md already is.
[changelog]
protect_breaking_commits = true

# Render a commit's scope as `_(scope)_`, not release-plz's default `*(scope)*`.
#
# `CHANGELOG.md` sits at the repo root, so `workspace:format:check` runs oxfmt
# over it, and oxfmt normalises markdown emphasis to underscores. The default
# template's asterisks therefore failed that check on **every release PR** —
# the same shape of bug as the committed Homebrew formula: a generated file
# held to a check its generator does not satisfy, with a manual reformat as the
# only remedy and nothing to stop it recurring next release.
#
# A postprocessor runs over the fully rendered changelog, so this fixes the
# output at the source and leaves the formatter covering the file. The
# alternative was overriding `body` wholesale, which means vendoring a copy of
# release-plz's default Tera template — whitespace control and all — and
# tracking its upstream changes, to win an asterisk-versus-underscore argument.
#
# Anchored to the list marker so it cannot touch `[**breaking**]` or any other
# emphasis inside a commit message: oxfmt leaves `**strong**` alone and only
# rewrites `*emphasis*`.
postprocessors = [{ pattern = '(?m)^- \*\(([^)]+)\)\*', replace = "- _(${1})_" }]

# release-plz writes a package's changelog beside its `Cargo.toml`, which for
# this layout means `packages/secreq/CHANGELOG.md` — a second, empty-history
# changelog nobody reads, while the real one at the root goes untouched.
#
# That is not cosmetic. `release.yml` extracts the GitHub Release notes by
# `awk`-ing the root `CHANGELOG.md` for the section matching the version, and
# packages that same file into every release tarball. Left alone, every
# release would ship notes that silently fell back to auto-generated ones,
# and a tarball whose changelog stopped at 0.1.0.
#
# `changelog_path` is relative to the root `Cargo.toml`, so this is the repo
# root. It is a `[[package]]` key; there is no workspace-level equivalent.
[[package]]
name = "secreq"
changelog_path = "CHANGELOG.md"
