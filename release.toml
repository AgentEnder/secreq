# cargo-release configuration — the SemVer + CHANGELOG side of the release
# flow. See dev-docs/RELEASING.md for the full runbook.
#
#   cargo release patch|minor|major        # or an explicit x.y.z
#
# bumps the version in Cargo.toml, rolls CHANGELOG.md's [Unreleased] section
# into a dated release section, commits, and creates the annotated `vX.Y.Z`
# tag. Pushing that tag (deliberately, by hand) triggers
# .github/workflows/release.yml, which cross-compiles, checksums, signs, and
# publishes the GitHub Release using the notes from the new CHANGELOG section.

# Cutting a release only makes sense from the trunk.
allow-branch = ["main"]

# Not published to crates.io (no upstream registry entry yet); the GitHub
# Release is the distribution channel. Flip `publish` to true once the crate
# is registered.
publish = false

# Tag locally; the maintainer pushes the tag explicitly with
# `git push --follow-tags` so a release is never an accidental side effect of
# a routine push. Keep this false.
push = false

tag-name = "v{{version}}"
tag-message = "secreq {{version}}"
pre-release-commit-message = "release: {{version}}"

# Signing of the git tag/commit is left to the maintainer's local git config
# so this repo doesn't presume a signing key exists.
sign-tag = false
sign-commit = false

# Roll CHANGELOG.md's "## [Unreleased]" heading into a fresh, dated release
# section as part of the bump. A new empty [Unreleased] is left on top for the
# next cycle. `{{date}}` is cargo-release's release-day (YYYY-MM-DD) variable.
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
