StylesPath = .vale/styles
MinAlertLevel = suggestion

# Published user documentation.
[docs/**/*.md]
BasedOnStyles = Secreq
# Inline code is identifiers, flags and paths, not prose.
TokenIgnores = (`[^`]+`)

# Generated from the clap tree by `cargo run --example gen-cli-reference`.
# Still worth linting: a finding here is real prose a reader sees. But the fix
# belongs in the doc comments in packages/secreq/src/cli.rs — editing this file
# is lost at the next regen. Headings are command invocations, not sentences.
[docs/cli-reference.md]
BasedOnStyles = Secreq
TokenIgnores = (`[^`]+`)
Secreq.Headings = NO
Secreq.Terminology = NO

# Headings here are literal install commands (`curl | sh`, `cargo install`)
# and the channel table links to their anchors, so they can't be sentence-cased.
[docs/install.md]
BasedOnStyles = Secreq
TokenIgnores = (`[^`]+`)
Secreq.Headings = NO

# The repo front door and the contributor guide.
[README.md]
BasedOnStyles = Secreq
TokenIgnores = (`[^`]+`)

[CONTRIBUTING.md]
BasedOnStyles = Secreq
TokenIgnores = (`[^`]+`)

# The rule-authoring SDK's README teaches with code; its headings are API
# identifiers and its prose is addressed to someone writing AssemblyScript.
[packages/secreq-rule/README.md]
BasedOnStyles = Secreq
TokenIgnores = (`[^`]+`)
Secreq.Headings = NO

# Harness conventions, written for whoever changes the fixtures. A different
# register from the guides (see .claude/skills/docs-audit/VOICE.md), so the
# reader-facing rules are relaxed — but the AI-tell rules still apply.
[dev-docs/**/*.md]
BasedOnStyles = Secreq
TokenIgnores = (`[^`]+`)
Secreq.Headings = NO
Secreq.SelfReferential = NO
Secreq.SentencePatterns = NO
