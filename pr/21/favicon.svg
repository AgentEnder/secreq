<!--
  The Gate Monogram on a graphite badge. Derived from dev-docs/brand/logo.svg —
  same two brackets and one accent dot the desktop app paints in
  daemon/ui.rs::paint_app_icon. Do not redraw it from a screenshot; change
  the master and re-derive.

  Why this one wears a badge when no other consumer does: a tab strip is
  not a surface we control. It may be light, dark, or — pinned, themed, or
  in a coloured window — any hue at all, and the bare mark has to survive
  all of them. So the badge brings its own background and the ink is fixed
  against it, rather than the mark trying to guess the strip's colour with
  a prefers-color-scheme switch that Safari would ignore anyway.

  Graphite, and the dark-appearance ink to go with it: the badge is the
  palette's own raised surface (the `sq-raised` token, #292d33), so the icon
  is a chip of the app's window rather than a light tile that matches
  nothing in it. It is
  a step lighter than the dark chrome it usually sits in, which is what
  keeps the silhouette from dissolving into a dark tab strip — a hairline
  ring was the alternative and it is worth nothing at 16px, where a
  three-quarter-unit stroke lands on a fifth of a pixel.

  Two deliberate deviations from the master, both optical:

    - Weights are the app's own small-size step (stroke 8, dot r 9 — the
      `size < 20.0` branch of paint_app_icon), and the badge's inset comes
      from scaling the whole group rather than from thinning the mark.
      Fattening the stroke instead is the obvious move and the wrong one:
      it eats the gap between bracket and dot, which is the negative space
      the shape is read by, and at 16px the mark fills into a blob.
    - The gate takes the dark-appearance foreground and the dot the docs'
      dark accent, since the badge it sits on is dark in every context.

  The badge is a superellipse, not a rounded rect and not the four-cubic
  "0.11" squircle: both of those spend too much of the side on curve. Each
  side runs straight for its middle half (x=16 to x=48 of 64) and the
  controls sit close to the corner point (k=13 of s=16), so the edge stays
  flat right up to where it turns.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="secreq">
  <title>secreq</title>

  <!-- The badge. -->
  <path
    d="M16 0 L48 0 C61 0 64 3 64 16 L64 48 C64 61 61 64 48 64 L16 64 C3 64 0 61 0 48 L0 16 C0 3 3 0 16 0 Z"
    fill="#292d33"
  />

  <!-- The mark, scaled about the badge's centre. The scale is the badge's
       padding: at 0.92 the brackets ran to within 6 units of the edge and
       read as clipped, so they are pulled in to leave a clear margin on
       all four sides. -->
  <g transform="translate(32 32) scale(0.82) translate(-32 -32)">
    <!-- The gate. -->
    <g fill="none" stroke="#e9e9eb" stroke-width="8" stroke-linejoin="miter">
      <path d="M23 10 H13 V54 H23" />
      <path d="M41 10 H51 V54 H41" />
    </g>
    <!-- The secret. -->
    <circle cx="32" cy="32" r="9" fill="#3584e4" />
  </g>
</svg>
