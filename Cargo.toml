[package]
name = "secreq"
version = "0.1.0"
edition = "2021"
description = "Per-binary CLI wrapper that injects credentials from your secret store of choice — 1Password Shell Plugins, but generic and multi-provider"
license = "MIT"

[[bin]]
name = "secreq"
path = "src/main.rs"

[lib]
name = "secreq"
path = "src/lib.rs"

[[example]]
name = "gen-schema"
path = "examples/gen_schema.rs"

[[example]]
name = "gen-auto-rules-schema"
path = "examples/gen_auto_rules_schema.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
json5 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
portable-pty = "0.8"
sysinfo = "0.33"
cliclack = "0.3"
crossterm = "0.28"
dirs = "5"
signal-hook = "0.3"
libc = "0.2"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.34"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
blake3 = "1"
rand = "0.8"
glob = "0.3"
# `p256` (not just `ecdsa`) is required for ecdsa-nistp256 signing/keygen:
# the `ecdsa` feature only pulls the `sec1` encoding, while the actual
# curve Signer impl is gated behind `p256`.
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "p256"] }
ssh-encoding = "0.2"
# Needed only to honor the SSH_AGENT_RSA_SHA2_256/512 SIGN_REQUEST flags:
# ssh-key 0.6's public Signer impl for RSA hardcodes SHA-512, so we drop to
# the same rsa::pkcs1v15 path it uses internally to select the hash. Pinned
# to the version ssh-key resolves; re-exports `sha2` and `signature`.
rsa = { version = "0.9", features = ["sha2"] }
# Unified textual diff for `secreq migrate restore`, which must show what a
# restore discards. Textual, not semantic: the binary doing the restore
# generally cannot parse both the current and the snapshot format (that is
# the premise of a downgrade), so a parsed diff is impossible in the case
# that actually needs the warning.
similar = "2"

# `.env` parsing for `secreq run --env-file` (quoting, escapes, `export`,
# `${VAR}` substitution). We use its non-mutating `from_path_iter`, never
# the env-loading entry points.
dotenvy = "0.15"

# macOS-only.
#
# `winit` re-exported for platform extension traits in `daemon/mod.rs`.
#
# `objc2-foundation` is for `NSProcessInfo.beginActivity(...)` which
# opts the consent-window child out of App Nap. Without it, macOS
# throttles our run loop when the window is in the background and
# updates from the daemon arrive minutes late. Used in
# `daemon/child.rs::macos_disable_app_nap`.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
objc2-foundation = "0.3"

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
