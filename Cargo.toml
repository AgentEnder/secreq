# Virtual workspace root. The crate itself lives at `packages/secreq`; this
# manifest only enumerates the members so `cargo` commands run from the repo
# root resolve them. The single `Cargo.lock` for the workspace lives here at
# the root (cargo ignores a lock inside a member), so `--locked` builds in CI
# and the release workflow read it from here.
[workspace]
members = ["packages/secreq", "packages/webfonts"]
resolver = "2"
