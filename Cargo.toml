[package]
name = "secreq"
version = "0.1.0"
edition = "2021"
description = "Per-binary CLI wrapper that injects credentials from your secret store of choice — 1Password Shell Plugins, but generic and multi-provider"
license = "MIT"

[[bin]]
name = "secreq"
path = "src/main.rs"

[lib]
name = "secreq"
path = "src/lib.rs"

[[example]]
name = "gen-schema"
path = "examples/gen_schema.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
json5 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
portable-pty = "0.8"
sysinfo = "0.33"
cliclack = "0.3"
crossterm = "0.28"
dirs = "5"
signal-hook = "0.3"
libc = "0.2"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
blake3 = "1"
rand = "0.8"

# macOS-only: needed to set the app's NSApplicationActivationPolicy to
# `Accessory` so the daemon doesn't show up in the Dock / Cmd+Tab while
# its window is hidden. eframe pulls in the same winit version
# transitively; declaring it here lets us name the platform extension
# traits in src/daemon/mod.rs.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
