# Clippy configuration for the workspace. `cargo clippy` reads this from the
# repo root for every crate under it; lint *levels* live in each crate's
# `[lints.clippy]` table in Cargo.toml.

# `indexing_slicing` is about code that indexes bytes or rows it did not
# choose. A test almost always indexes a vector it built two lines earlier,
# where the offset is the thing being asserted and an out-of-range access is a
# failing test rather than a reachable panic — so in tests the lint reports
# noise, and 141 of the crate's 213 hits were exactly that.
#
# One switch here rather than an `#![allow(...)]` at the top of every
# `mod tests`: those have to be written by hand, they get copied into new
# modules by imitation without anyone re-deciding, and the reason ends up
# restated — or not — thirty times over. Saying it once keeps the production
# half of the lint honest, which is the half worth having.
allow-indexing-slicing-in-tests = true

# `unwrap_used` is the same shape of argument. In a test a panic *is* the
# assertion — `parse(…).unwrap()` says "this must parse" as directly as an
# `assert!` would, and the failure output names the file and line either way.
# In `src` an `unwrap` is a claim nobody wrote down, which is the half worth
# denying. The lint sat out as "pervasive in the inline test modules"; 781 of
# its 942 hits were exactly that, and the library itself was already at zero.
#
# Same reasoning as above for putting it here rather than in each `mod tests`:
# one decision, stated once, instead of thirty copies of an `#![allow]` nobody
# re-reads.
allow-unwrap-in-tests = true
