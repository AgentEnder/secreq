# Dev tool versions, shared by contributors and CI.
#
# CI installs these with `jdx/mise-action`, so a green build and a local run
# use the same toolchain. Before this existed the two could disagree silently:
# CI resolved `dtolnay/rust-toolchain@stable` to whatever stable meant that
# morning, and `vale` was on PATH or it wasn't.
#
#   mise install     # once, and after any change here
#
# This file pins tools and nothing else. It used to also carry `[tasks.docs]`
# and `[tasks.docs-audit]`, which meant two of the repo's checks were invisible
# to nx — uncacheable, and unable to say which projects they applied to. They
# are `nx run docs:lint` and `nx run docs:audit` now.
#
[tools]
# Matches the release workflow's toolchain. Pinned rather than "stable"
# because a clippy lint added in a new stable release turns an unrelated PR
# red, and the fix belongs in its own commit.
#
# `components` is not optional here, and the reason is easy to miss locally:
# mise installs the toolchain through rustup, so a developer whose rustup
# default profile already carries rustfmt and clippy gets them and never
# notices. A fresh CI runner takes rustup's minimal profile and does not, so
# `cargo fmt` and `cargo clippy` fail with "not installed for the toolchain" —
# in the two jobs whose only purpose is to run them.
rust = { version = "1.97.1", components = ["rustfmt", "clippy"] }

# The `web` job's version. pnpm comes from package.json's `packageManager`
# field via corepack, so it is deliberately not listed here.
node = "26"

# Prose linter. See .vale.ini and .vale/styles/Secreq/.
vale = "3.15.2"
